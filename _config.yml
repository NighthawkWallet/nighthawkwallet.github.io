# Feature List                            Edit, add or remove features to be presented.
features                                  :

  - title                                 : Private by default
    description                           : Trial decryption finds your notes on this device. The server does not learn which payments are yours. UnifOMR stays off unless you turn it on.
    fontawesome_icon_name                 : user-secret

  - title                                 : Nym mixnet
    description                           : Android and iOS send the wallet, DarkIRC, and the node through Nym. Switch to Tor or a direct connection when you want to.
    fontawesome_icon_name                 : random

  - title                                 : DarkIRC
    description                           : In-process chat on phone and desktop. Public channels and encrypted direct messages stay on the device.
    fontawesome_icon_name                 : comments

  - title                                 : Nighthawk Mesh
    description                           : Nearby phones pass an encrypted EventGraph hop over Bluetooth. Share-internet stays off.
    fontawesome_icon_name                 : bluetooth-b

  - title                                 : Phone and desktop
    description                           : The same wallet core on Android, iOS, and desktop. Request a payment, receive, send DRK or a custom token, and open the DAO hub.
    fontawesome_icon_name                 : mobile-alt

  - title                                 : Your keys
    description                           : A 22-word seed, a PIN, and a seed backup. Nighthawk does not hold the funds.
    fontawesome_icon_name                 : key

  - title                                 : An honest sync light
    description                           : Green only while lightwalletd is current. The wallet says when the served tip has not reached darkfid recently.
    fontawesome_icon_name                 : eye

  - title                                 : DarkFi money
    description                           : Confidential DRK transfers today, plus a read-only DAO hub. Multi-asset balances and stablecoin support are coming.
    fontawesome_icon_name                 : coins

  - title                                 : Dex
    description                           : The Dex tab is in the app. Trading is coming soon.
    fontawesome_icon_name                 : exchange-alt

